
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: wallet-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets:
          - api-service:8080
  - job_name: wallet-saga
    metrics_path: /metrics
    static_configs:
      - targets:
          - saga-orchestrator:8081
  - job_name: wallet-reconciliation
    metrics_path: /metrics
    static_configs:
      - targets:
          - reconciliation:8081
